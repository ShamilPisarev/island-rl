# The M4 annealing test: continue training the SHAPED policy with every shaping
# term returned to zero, and ask whether the construction behaviour survives.
#
# The brief asks for exactly this ("test whether it can be annealed away"). The
# two-phase form -- train shaped, then keep training unshaded from the shaped
# checkpoint -- answers it without new reward plumbing: if shelter-building
# persists once nothing pays for it, the shaping was a bootstrap into a
# genuinely better policy; if it decays back toward the unshaped control, the
# shaping was only ever buying the behaviour, which is the M3 shaping-ablation
# outcome all over again.
#
#   python -m sim.train --config config/m4_anneal.yaml --run-name m4-anneal \
#       --updates 200 --policy-mode individual --init-from checkpoints/m4/latest.pt

extends: m4.yaml

reward:
  wood: 0.0
  stone: 0.0
  build: 0.0
  complete: 0.0
