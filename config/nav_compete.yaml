# Does COMPETITION for bushes destroy navigation? One variable off m3_masked.
#
# THE FINDING THIS TESTS. Toward-food share by current distance (50% = a coin
# flip; hovering ON the target necessarily scores ~50%, so only the far buckets
# measure approach at all):
#
#                        0-3     3-6    6-10   10-20    20+
#   nav-probe          48.7%   66.8%   74.6%   80.1%   86.1%     <- navigation IS learnable
#   m1                 47.4%   60.9%   71.1%     --      --      <- M1 learned it
#   m3-masked          50.6%   49.3%   56.5%   54.3%   50.5%     <- M3 does not have it
#   m4h                50.3%   53.8%   56.3%   52.3%   51.2%
#   random             47.8%   48.6%   50.3%   51.0%   49.0%
#   scripted forager                          100.0%  100.0%
#
# Navigation is learnable in this setup -- the probe settles that -- and M1 had
# it. The milestone chain then LOST it: m3-masked and m4h are within a couple of
# points of a random walk at every range, despite forking from a policy that
# could navigate. That is the real form of the project's oldest open problem, and
# it is not what it was written up as.
#
# THE HYPOTHESIS. `exclusive_bushes` means only the agent CLOSEST to a bush may
# take from it. In a six-bush world where bushes are empty most of the time,
# setting off toward a distant berry usually means arriving second and getting
# nothing. Under that rule navigation genuinely stops paying, so it decays --
# and every later milestone inherits the decayed policy. If that is right,
# turning the rule off should preserve the navigation the M2 checkpoint starts
# with.
#
# This config is m3_masked.yaml with `exclusive_bushes: false` and NOTHING else
# changed -- same scarcity, same six bushes, same stealing, same action masking,
# same M2 initialisation. `contest_bushes` stays on (one taker per bush per tick)
# because it was measured to be nearly inert, so leaving it in keeps the diff to
# a single meaningful rule.
#
# PREDICTION, written before the run.
#
#   * If the hypothesis holds: the 6-10 and 10-20 buckets rise clear of m3-masked's
#     56.5% / 54.3%, back toward M1's 60-71%. Navigation preserved.
#   * If it does not: navigation decays anyway, and the cause is scarcity itself
#     (a bush you walk to is usually empty) rather than who is allowed to take
#     from it. That would point at bush DENSITY, not the competition rules.
#   * Lifespan is a secondary read and is expected to RISE simply because removing
#     exclusivity makes food easier to get. Do not read that as the result -- the
#     measurement is the distance-bucketed toward-food share, and m3-masked's
#     471.6 was scored under a harder rule.
#
#   python -m sim.train --config config/nav_compete.yaml --run-name nav-compete \
#       --updates 200 --policy-mode individual --init-from checkpoints/m2/latest.pt
extends: m3_masked.yaml

competition:
  exclusive_bushes: false
