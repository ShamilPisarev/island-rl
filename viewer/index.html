<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island — replay viewer</title>

<!-- Three.js from CDN via import map: no build step, no bundler.
     This means the viewer needs network access on first load. -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
  :root {
    --bg: #0d1117;
    --panel: #141b24;
    --panel-2: #1b2531;
    --line: #26303d;
    --text: #d7e0ea;
    --dim: #7c8b9c;
    --accent: #6fc3df;
    --good: #6ec46e;
    --warn: #e0b83c;
    --bad: #e0563c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: grid; grid-template-columns: 1fr 310px; grid-template-rows: 1fr auto; height: 100%; }
  #stage { position: relative; grid-column: 1; grid-row: 1; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* ---- side panel ---- */
  #panel {
    grid-column: 2; grid-row: 1 / span 2;
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  #panel header { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  #panel h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .04em; }
  #panel h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 11px; }
  .sub a { color: var(--accent); text-decoration: none; }
  .sub a:hover { text-decoration: underline; }

  .picker { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  select, button, input[type=file]::file-selector-button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 9px; font: inherit; cursor: pointer;
  }
  select { width: 100%; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #06121a; border-color: var(--accent); font-weight: 600; }
  .hint { color: var(--dim); font-size: 10.5px; }

  #summary { padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  #summary b { color: var(--text); font-weight: 600; }

  #agents { overflow-y: auto; flex: 1; min-height: 0; padding: 6px; }
  .agent {
    display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center;
    padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  }
  .agent:hover { background: var(--panel-2); }
  .agent.followed { background: var(--panel-2); border-color: var(--accent); }
  .agent.dead { opacity: .45; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .agent .name { font-weight: 600; font-size: 12px; }
  .agent .meta { color: var(--dim); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: #263140; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--good); }
  .act {
    font-variant-numeric: tabular-nums; font-size: 10.5px; color: var(--dim);
    background: var(--panel-2); border-radius: 4px; padding: 2px 6px; min-width: 46px; text-align: center;
  }

  /* ---- transport ---- */
  #transport {
    grid-column: 1; grid-row: 2;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line);
  }
  #transport .speeds { display: flex; gap: 4px; }
  #scrub { flex: 1; accent-color: var(--accent); cursor: pointer; }
  #tickCount { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 96px; text-align: right; }
  #play { min-width: 74px; }

  /* ---- overlays ---- */
  #fatal, #drop {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    padding: 40px; z-index: 20;
  }
  #fatal { background: rgba(13,17,23,.94); }
  #fatal .box { border: 1px solid var(--bad); border-left-width: 4px; border-radius: 8px;
                background: var(--panel); padding: 20px 24px; max-width: 560px; text-align: left; }
  #fatal h2 { margin: 0 0 8px; color: var(--bad); font-size: 14px; }
  #fatal pre { margin: 0; white-space: pre-wrap; color: var(--dim); font-size: 12px; }
  #drop { background: rgba(13,17,23,.8); border: 2px dashed var(--accent); }
  #drop b { color: var(--accent); font-size: 16px; }
  #loading { position: absolute; left: 14px; top: 12px; color: var(--dim); z-index: 10; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="loading">loading…</div>
    <div id="fatal"><div class="box"><h2 id="fatalTitle">Cannot render this replay</h2><pre id="fatalMsg"></pre></div></div>
    <div id="drop"><b>Drop a replay .json to load it</b></div>
  </div>

  <aside id="panel">
    <header>
      <h1>ISL<span>A</span>ND</h1>
      <div class="sub" id="replayLabel">no replay loaded</div>
      <div class="sub" style="margin-top:4px"><a href="./divergence.html">divergence view →</a></div>
    </header>

    <div class="picker">
      <select id="replaySelect"><option value="">— select a replay —</option></select>
      <input type="file" id="fileInput" accept=".json">
      <div class="hint" id="pickerHint">Drag a .json anywhere to load it.</div>
    </div>

    <div id="summary"></div>
    <div id="agents"></div>
  </aside>

  <div id="transport">
    <button id="play">❚❚ Pause</button>
    <div class="speeds" id="speeds"></div>
    <input type="range" id="scrub" min="0" max="0" value="0" step="0.001">
    <div id="tickCount">0 / 0</div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
